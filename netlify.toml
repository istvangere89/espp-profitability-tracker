[build]
  # No build step needed for static site
  command = "echo 'Static site, no build required'"
  # Publish the src directory as the website root
  publish = "src"

[functions]
  # Node.js functions directory
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = { NOT = ["{path}" , "/api/*"] }

# Cache headers for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"  # 1 year for versioned assets

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"  # 1 year for versioned assets

# Cache headers for index and HTML
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"  # No cache, always check

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# API Gateway replacement - CORS proxy function
# Called from src/js/api.js as /.netlify/functions/cors-proxy?url=...
