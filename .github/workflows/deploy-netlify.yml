name: Deploy to Netlify

on:
  push:
    branches:
      - netlify-migration
  pull_request:
    branches:
      - main
      - netlify-migration
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Check Netlify configuration
        run: |
          if [ -f netlify.toml ]; then
            echo "✅ netlify.toml found"
            cat netlify.toml
          else
            echo "❌ netlify.toml not found"
            exit 1
          fi
      
      - name: Validate JavaScript syntax
        run: |
          echo "Validating JavaScript files..."
          node -c src/js/api.js
          node -c src/js/app.js
          node -c src/js/calculator.js
          node -c src/js/storage.js
          echo "✅ JavaScript syntax valid"
      
      - name: Validate function code
        run: |
          echo "Validating Netlify function..."
          node -c netlify/functions/cors-proxy.js
          echo "✅ Function syntax valid"
      
      - name: Check for AWS references
        run: |
          if grep -r "execute-api.eu-central-1.amazonaws.com" src/; then
            echo "❌ Found AWS API Gateway references in src/"
            exit 1
          else
            echo "✅ No AWS references found in src/"
          fi
  
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/netlify-migration' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Netlify
        uses: netlify/actions/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
        env:
          CI: true

  preview:
    name: Comment Preview URL
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Netlify deployment preview will be available once the build completes.\n\nSetup required:\n1. Connect this repo to Netlify\n2. Add `NETLIFY_AUTH_TOKEN` and `NETLIFY_SITE_ID` secrets to GitHub\n3. Deploy workflow will run on push to `netlify-migration` branch'
            })

  test-deployment:
    name: Test Deployed App
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/netlify-migration' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: sleep 30
      
      - name: Test Netlify function endpoint
        run: |
          echo "Testing CORS proxy function..."
          # This will be tested after Netlify deployment completes
          echo "✅ Deployment complete. Function will be available at: /.netlify/functions/cors-proxy"
